<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SK Industries India Pvt Ltd - Prediction Dashboard</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 80px 20px;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientAnimation 12s ease infinite;
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 780px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(10, 0, 0, 0.25),
                        0 0 0 1px rgba(255, 255, 255, 0.4) inset;
        }

        .header-badge {
            display: inline-block;
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            padding: 8px 18px;
            border-radius: 20px;
            margin-bottom: 14px;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.35);
        }

        h1 {
            text-align: left;
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #2D3748, #4A5568);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
            line-height: 1.3;
        }

        .form-group {
            position: relative;
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }

        .form-col {
            flex: 1;
            margin-bottom: 0;
        }

        label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 700;
            color: #2D3748;
            margin-bottom: 8px;
        }

        label span {
            font-size: 12px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .badge-temp-air { background: #EBF8FF; color: #3182CE; }
        .badge-temp-proc { background: #FEFCBF; color: #D69E2E; }
        .badge-speed { background: #EBF8FF; color: #00B5D8; }
        .badge-torque { background: #FEEBC8; color: #DD6B20; }
        .badge-wear { background: #FED7D7; color: #E53E3E; }
        .badge-age { background: #E9D8FD; color: #805AD5; }
        .badge-hours { background: #E6FFFA; color: #319795; }

        input {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            font-weight: 600;
            color: #1A202C;
            border: 2px solid #E2E8F0;
            border-radius: 12px;
            outline: none;
            background: #F7FAFC;
            transition: all 0.25s ease;
        }

        input:focus {
            border-color: #667EEA;
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.25);
            transform: translateY(-1px);
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
            color: white;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(118, 75, 162, 0.35);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 26px rgba(118, 75, 162, 0.45);
        }

        .back {
            display: inline-block;
            width: 100%;
            text-align: center;
            margin-top: 20px;
            color: #718096;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
        }

        .back:hover { color: #2D3748; }

        @media (max-width: 580px) {
            .form-row {
                flex-direction: column;
                gap: 20px;
            }
            .header-badge { font-size: 13px; }
            h1 { font-size: 26px; }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header-badge">SK Industries India Pvt Ltd</div>
    <h1>Machine Failure Prediction</h1>

    <form action="/predict" method="POST" onsubmit="prepareFormData()">

        <!-- Air Temperature -->
        <div class="form-group">
            <label>
                Air Temperature
                <span class="badge-temp-air">Range: 250 - 750 K</span>
            </label>
            <input 
                name="air_temperature" 
                type="number" 
                min="250" 
                max="750" 
                step="any" 
                placeholder="250 - 750" 
                oninput="clampInput(this, 250, 750, false)"
                onblur="clampInput(this, 250, 750, true)"
                required
            >
        </div>

        <!-- Process Temperature -->
        <div class="form-group">
            <label>
                Process Temperature
                <span class="badge-temp-proc">Range: 250 - 750 K</span>
            </label>
            <input 
                name="process_temperature" 
                type="number" 
                min="250" 
                max="750" 
                step="any" 
                placeholder="250 - 750" 
                oninput="clampInput(this, 250, 750, false)"
                onblur="clampInput(this, 250, 750, true)"
                required
            >
        </div>

        <!-- Rotational Speed -->
        <div class="form-group">
            <label>
                Rotational Speed
                <span class="badge-speed">Range: 1000 - 3000 RPM</span>
            </label>
            <input 
                name="rotational_speed" 
                type="number" 
                min="1000" 
                max="3000" 
                step="any" 
                placeholder="1000 - 3000" 
                oninput="clampInput(this, 1000, 3000, false)"
                onblur="clampInput(this, 1000, 3000, true)"
                required
            >
        </div>

        <!-- Torque -->
        <div class="form-group">
            <label>
                Torque
                <span class="badge-torque">Range: 0 - 100 Nm</span>
            </label>
            <input 
                name="torque" 
                type="number" 
                min="0" 
                max="100" 
                step="any" 
                placeholder="0 - 100" 
                oninput="clampInput(this, 0, 100, false)"
                onblur="clampInput(this, 0, 100, true)"
                required
            >
        </div>

        <!-- Tool Wear -->
        <div class="form-group">
            <label>
                Tool Wear
                <span class="badge-wear">Range: 0 - 300 mins</span>
            </label>
            <input 
                name="tool_wear" 
                type="number" 
                min="0" 
                max="300" 
                step="any" 
                placeholder="0 - 300" 
                oninput="clampInput(this, 0, 300, false)"
                onblur="clampInput(this, 0, 300, true)"
                required
            >
        </div>

        <!-- Machine Age -->
        <div class="form-row">
            <div class="form-group form-col">
                <label>
                    Machine Age (Years)
                    <span class="badge-age">0 - 20 yrs</span>
                </label>
                <input 
                    name="machine_age_years" 
                    type="number" 
                    min="0" 
                    max="20" 
                    step="1" 
                    placeholder="0 - 20" 
                    oninput="clampInput(this, 0, 20, false)"
                    onblur="clampInput(this, 0, 20, true)"
                    required
                >
            </div>

            <div class="form-group form-col">
                <label>
                    Machine Age (Months)
                    <span class="badge-age">0 - 11 mos</span>
                </label>
                <input 
                    name="machine_age_months" 
                    type="number" 
                    min="0" 
                    max="11" 
                    step="1" 
                    placeholder="0 - 11" 
                    oninput="clampInput(this, 0, 11, false)"
                    onblur="clampInput(this, 0, 11, true)"
                    required
                >
            </div>
        </div>

        <!-- Hidden payload to preserve Flask compatibility for machine_age key -->
        <input type="hidden" name="machine_age" id="machine_age">

        <!-- Operating Hours -->
        <div class="form-group">
            <label>
                Operating Hours
                <span class="badge-hours">Range: 00:01 - 10000:00  HH:MM</span>
            </label>
            <input 
                name="operating_hours" 
                type="number" 
                min="00:01" 
                max="10000:00" 
                step="1" 
                placeholder="HH:MM" 
                oninput="clampInput(this, 00:00, 10000:00, false)"
                onblur="clampInput(this, 00:00, 10000:00, true)"
                required
            >
        </div>

        <button type="submit"> Predict </button>

    </form>

    <a class="back" href="/">← Back to Dashboard</a>

</div>

<script>
/**
 * Restricts input values in real time:
 * - If the typed value exceeds max, it forces it down to max immediately.
 * - On blur (leaving the input field), if the value is lower than min or empty, it sets it to min.
 */
function clampInput(input, min, max, isBlur) {
    if (input.value === "") return;

    let val = parseFloat(input.value);

    // Prevent typing above max instantly
    if (val > max) {
        input.value = max;
    }

    // On focus lost, fix values lower than minimum
    if (isBlur) {
        if (isNaN(val) || val < min) {
            input.value = min;
        }
    }
}

function prepareFormData() {
    const years = parseFloat(document.querySelector('[name="machine_age_years"]').value) || 0;
    const months = parseFloat(document.querySelector('[name="machine_age_months"]').value) || 0;
    document.getElementById('machine_age').value = years + (months / 12);
}
</script>

</body>
</html>
